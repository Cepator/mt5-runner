name: M1 gold 2023 fetch

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install fetcher and pull XAUUSD M1 2023
        shell: bash
        run: |
          pip install git+https://github.com/Njenjo/histdata-fetcher.git
          python - <<'PY'
          from histdata_fetcher import fetch_data
          r = fetch_data(pair="XAUUSD", start_date="2023-01-01", end_date="2023-12-31", timeframe="1min", output_format="csv", output_path="XAUUSD_M1_2023.csv")
          print("FETCH_OK", r)
          PY

      - name: Upload data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-gold-2023
          path: "*.csv"
