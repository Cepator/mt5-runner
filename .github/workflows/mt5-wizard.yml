            try { $ph2x = [int]$lblPh.X + 430 } catch { $ph2x = 530 }
            $ph2y = $phy
            Click $ph2x $ph2y
            Start-Sleep -Milliseconds 400
            $ws.SendKeys("^a")
            Start-Sleep -Milliseconds 150
            $ws.SendKeys("{DEL}")
            Start-Sleep -Milliseconds 200
            $ws.SendKeys($local)
            Start-Sleep -Milliseconds 800
            $gotPh = Read-At $ph2x $ph2y
            $gotPhN = "$gotPh" -replace "[^0-9]", ""
            Write-Host ("PHONE_READBACK_RETRY: digits={0}" -f $gotPhN.Length)
          }
          # v26 guard: the email must have survived the phone fill (v25 lesson).
          $gotEm = Read-At 310 301
          if ("$gotEm" -match "@") { Write-Host "EMAIL_INTACT: True" }
          else {
            Write-Host "EMAIL_WIPED: restoring rivet5592@agentmail.to"
            Click 310 301
            Start-Sleep -Milliseconds 400
            $ws.SendKeys("^a")
            Start-Sleep -Milliseconds 150
            $ws.SendKeys("{DEL}")
            Start-Sleep -Milliseconds 200
            $ws.SendKeys("rivet5592@agentmail.to")
            Start-Sleep -Milliseconds 800
            $gotEm = Read-At 310 301
            Write-Host "EMAIL_RESTORED: [$gotEm]"
          }
          # v28: the phone-country attempt is GONE. v27 evidence: the combo
          # finder matched the phone Edit itself (PHONE_COMBO name=[0721443778]),
          # "Czech" went into the masked number field, and the wizard was
          # destroyed within seconds (PHONE_READBACK_POSTCOUNTRY digits=0,
          # EMAIL_INTACT2 False, v27-7b/7d/8 shots show a bare terminal, every
          # later FromHandle died with "Unrecognized error"). No country
          # interaction survives into v28; the NANP-valid local number above
          # removes the pink-field risk instead.
          Write-Host "PHONE_COUNTRY_SKIP: v27 destroyed the wizard by typing letters into the phone field; country combo untouched in v28"
          $gotPh2 = Read-At $phx $phy
          $gotPh2N = "$gotPh2" -replace "[^0-9]", ""
          Write-Host ("PHONE_READBACK_POSTFILL: digits={0}" -f $gotPh2N.Length)
          $gotEm2 = Read-At 310 301
          if ("$gotEm2" -match "@") { Write-Host "EMAIL_INTACT2: True" }
          elseif ([W.N2]::IsWindowVisible($wizH)) {
            Write-Host "EMAIL_INTACT2: False, restoring (wizard alive)"
            Click 310 301
            Start-Sleep -Milliseconds 400
            $ws.SendKeys("^a")
            Start-Sleep -Milliseconds 150
            $ws.SendKeys("{DEL}")
            Start-Sleep -Milliseconds 200
            $ws.SendKeys("rivet5592@agentmail.to")
            Start-Sleep -Milliseconds 800
            Write-Host "EMAIL_RESTORED2: done"
          } else { Write-Host "EMAIL_INTACT2: False but wizard handle dead - NO restore typing into the void" }
          Write-Host ("PHONE_FILL: typed {0} digits (value masked)" -f $local.Length)
          Shot "v28-7b-phone"
          Dump-RadioChecks "afterfill"
          Write-Host "FILL_COUNT: ok=$fillOk of 4"
          # PHASE 3: terms checkbox. v23: UIA name probe agree|terms|conditions
          # found NOTHING (label owner-drawn/unnamed) and vision confirms an
          # unticked checkbox below the phone row. Hunt the smallest square
          # native control 25-90px under the phone row and click it.
          $termsDone = $false
          $script:termsZone = New-Object System.Collections.ArrayList
          if ($script:pcRowY -eq $null) { $script:pcRowY = 328 }
          try {
            $cbT = [W.EnumProc]{ param($h, $l)
              try {
                $clsT = New-Object System.Text.StringBuilder 256
                [W.N2]::GetClassName($h, $clsT, 256) | Out-Null
                $rr = New-Object W.RECT
                [W.N2]::GetWindowRect($h, [ref]$rr) | Out-Null
                $ww = $rr.Right - $rr.Left; $hh = $rr.Bottom - $rr.Top
                $zc = [int](($rr.Top + $rr.Bottom)/2)
                if ([W.N2]::IsWindowVisible($h) -and $ww -gt 4 -and $ww -le 30 -and $hh -gt 4 -and $hh -le 30 -and [Math]::Abs($ww - $hh) -le 6 -and ($zc - $script:pcRowY) -gt 20 -and ($zc - $script:pcRowY) -lt 95) {
                  [void]$script:termsZone.Add(@{ h = $h; cls = $clsT.ToString(); cx = [int](($rr.Left + $rr.Right)/2); cy = $zc; w = $ww })
                }
              } catch {}
              return $true
            }
            [W.N2]::EnumChildWindows($wizH, $cbT, [IntPtr]::Zero) | Out-Null
            foreach ($z in $script:termsZone) { Write-Host ("TERMS_ZONE: h={0} class=[{1}] click=({2},{3}) w={4}" -f $z.h.ToInt64(), $z.cls, $z.cx, $z.cy, $z.w) }
            if ($script:termsZone.Count -gt 0) {
              $pick = $script:termsZone | Sort-Object { $_.w } | Select-Object -First 1
              Write-Host ("TERMS_CLICK: class=[{0}] click=({1},{2})" -f $pick.cls, $pick.cx, $pick.cy)
              Click $pick.cx $pick.cy
              Start-Sleep -Seconds 2
              $termsDone = $true
            }
          } catch { Write-Host "TERMS_HUNT_ERROR: $($_.Exception.Message)" }
          if (-not $termsDone) {
            # v25: v24's label-left click (318,517) hit label text; the square
            # sits just left of the label start (~x=292, aligned with input boxes).
            Write-Host "TERMS_FALLBACK: fixed square click (292,517)"
            Click 292 517
            Start-Sleep -Milliseconds 800
          }
          # v27: v26's "reclick on nopattern" double-toggled the checkbox
          # (v25 single click = CHECKED; v26 click + blind reclick = UNCHECKED
          # in every shot). The pane exposes NO Toggle pattern here, so an
          # unreadable state must NOT trigger a second click. One click only;
          # reclick solely on an explicit Off read.
          $termsState = ""
          try {
            $ptT = New-Object System.Windows.Point(292, 517)
            $elT = [System.Windows.Automation.AutomationElement]::FromPoint($ptT)
            $tp = $null
            try { $tp = $elT.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern) } catch {}
            if ($tp -ne $null) { $termsState = "$($tp.Current.ToggleState)"; Write-Host "TOGGLE_STATE: [$termsState]" }
            else { Write-Host "TOGGLE_STATE: nopattern at (292,517) - trusting the single click" }
          } catch { Write-Host "TOGGLE_ERROR: $($_.Exception.Message)" }
          if ($termsState -eq "Off") {
            Write-Host "TERMS_RECLICK: explicit Off, clicking (292,517) once more"
            Click 292 517
            Start-Sleep -Milliseconds 900
          } else { Write-Host "TERMS_CLICK_ONCE: no blind reclick (nopattern or On)" }
          if (-not [W.N2]::IsWindowVisible($wizH)) { Write-Host "WIZARD_GONE: before terms verification - evidence only" }
          Dump-RadioChecks "afterterms"
          Shot "v28-8-terms"
          # PHASE 4: submit and capture the result page
          # v26: name the exact blockers before polling Next. v25's Next stayed
          # greyed on dob+email validation with no record of which errors showed.
          try {
            if (-not [W.N2]::IsWindowVisible($wizH)) { throw "wizard handle invalid (WIZARD_GONE pre-scan)" }
            $winVe = [System.Windows.Automation.AutomationElement]::FromHandle($wizH)
            $ctrlsVe = $winVe.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            $vi = 0
            foreach ($cv in $ctrlsVe) {
              $nv = ""
              try { $nv = $cv.Current.Name } catch {}
              if ($nv -match "valid |Required|invalid|must |enter a|Please") { Write-Host ("VALIDATION_ERRORS[{0}]: {1}" -f $vi, $nv); $vi++ }
            }
            if ($vi -eq 0) { Write-Host "VALIDATION_ERRORS: none" }
          } catch { Write-Host "VALIDATION_SCAN_ERROR: $($_.Exception.Message)" }
          # v25: Next was greyed the whole v24 run (invalid form, no servers).
          # Poll IsEnabled up to 10s so the submit click actually advances.
          $nextEnabled = $false
          try {
            if (-not [W.N2]::IsWindowVisible($wizH)) { throw "wizard handle invalid (WIZARD_GONE pre-poll)" }
            $winN = [System.Windows.Automation.AutomationElement]::FromHandle($wizH)
            $ctrlsN = $winN.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            foreach ($cn in $ctrlsN) {
              $nn = ""
              try { $nn = $cn.Current.Name } catch {}
              if ($nn -match "^Next") {
                for ($ni = 0; $ni -lt 5; $ni++) {
                  $en = $cn.Current.IsEnabled
                  Write-Host "NEXT_ENABLED[$ni]: $en"
                  if ($en) { $nextEnabled = $true; break }
                  Start-Sleep -Seconds 2
                }
                break
              }
            }
          } catch { Write-Host "NEXT_POLL_ERROR: $($_.Exception.Message)" }
          if (-not $nextEnabled) { Write-Host "NEXT_NEVER_ENABLED: submitting anyway for evidence" }
          if (-not [W.N2]::IsWindowVisible($wizH)) { Write-Host "WIZARD_GONE: before submit click - no click sent, evidence only" }
          else {
            $nb = Find-Button "submit"
            if ($nb -ne $null) { Write-Host ("BUTTON[submit]: name=[{0}] click=({1},{2})" -f $nb.name, $nb.cx, $nb.cy); Click $nb.cx $nb.cy }
            else { Write-Host "BUTTON[submit]: NOT FOUND, fallback (727,608)"; Click 727 608 }
          }
          Start-Sleep -Seconds 20
          Shot "v28-9-result"
          $script:seenLogin = $false; $script:seenPass = $false; $script:seenServer = $false
          try {
            if (-not [W.N2]::IsWindowVisible($wizH)) { throw "wizard handle invalid (WIZARD_GONE pre-result)" }
            $winR = [System.Windows.Automation.AutomationElement]::FromHandle($wizH)
            $ctrlsR = $winR.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            $ri = 0
            foreach ($c in $ctrlsR) {
              $rn = ""
              try { $rn = $c.Current.Name } catch {}
              if ($rn -ne "" -and $rn.Length -gt 1) {
                Write-Host ("RESULT_TEXT[{0}]: {1}" -f $ri, $rn)
                if ($rn -match "Login|Password|Server|created|Investor") { Write-Host "ACCOUNT_HINT: [$rn]" }
                if ($rn -match "Login") { $script:seenLogin = $true }
                if ($rn -match "Password") { $script:seenPass = $true }
                if ($rn -match "Server") { $script:seenServer = $true }
              }
              $ri++
            }
          } catch { Write-Host "RESULT_DUMP_ERROR: $($_.Exception.Message)" }
          if ($script:seenLogin -and $script:seenPass -and $script:seenServer) {
            Write-Host "CREDS_CAPTURED: Login+Password+Server strings all present in result dump - extract values from shots"
          } else { Write-Host "CREDS_CAPTURED: no complete credential trio in result dump" }
          $s3 = Test-Subform "postnext"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizard-v28
          path: "v28-*.png"
