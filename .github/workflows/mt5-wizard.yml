name: MT5 wizard attempt v17

on:
  workflow_dispatch: {}

jobs:
  mt5:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install and boot MT5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" -Wait
          Start-Process -FilePath "C:\Program Files\MetaTrader 5\terminal64.exe" -ArgumentList "/portable"
          Start-Sleep -Seconds 75

      - name: Drive wizard, radio HWND via child enum + BM_CLICK (v16 FOCUSCHAIN hwnds), fill
        shell: pwsh
        env:
          PURPLE_PHONE: ${{ secrets.PURPLE_PHONE }}
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          Add-Type -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(int f, int dx, int dy, int d, int i);' -Name M -Namespace W
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          namespace W {
            public struct RECT { public int Left, Top, Right, Bottom; }
            public struct POINT { public int X, Y; }
            public class N2 {
              [DllImport("user32.dll")] public static extern IntPtr FindWindowEx(IntPtr parent, IntPtr child, string cls, string win);
              [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
              [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr h, StringBuilder sb, int max);
              [DllImport("user32.dll")] public static extern int GetClassName(IntPtr h, StringBuilder sb, int max);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
              [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, uint msg, IntPtr w, IntPtr l);
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, ref RECT r);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll")] public static extern bool InvalidateRect(IntPtr h, IntPtr rect, bool erase);
              [DllImport("user32.dll")] public static extern IntPtr SetFocus(IntPtr h);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
              [DllImport("user32.dll")] public static extern IntPtr WindowFromPoint(POINT p);
              [DllImport("user32.dll")] public static extern IntPtr GetAncestor(IntPtr h, uint flags);
            }
          }
          '@
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Click($x, $y) {
            [W.M]::SetCursorPos($x, $y) | Out-Null
            Start-Sleep -Milliseconds 300
            [W.M]::mouse_event(2, 0, 0, 0, 0)
            [W.M]::mouse_event(4, 0, 0, 0, 0)
          }
          $ws = New-Object -ComObject WScript.Shell
          if ($ws.AppActivate("LiveUpdate")) { Start-Sleep -Seconds 2; $ws.SendKeys("{ESC}"); Start-Sleep -Seconds 3 }
          $null = $ws.AppActivate("Open an Account")
          Start-Sleep -Seconds 2
          $ws.SendKeys("Purple")
          Start-Sleep -Seconds 6
          Shot "v17-1-searched"
          $ws.SendKeys("{ENTER}")
          Start-Sleep -Seconds 8
          Shot "v17-2-afterenter"
          Click 600 241
          Start-Sleep -Seconds 3
          Shot "v17-3-rowclick"
          Click 723 610
          Start-Sleep -Seconds 2
          Shot "v17-4-form"
          # v17: early arrows are structurally dead (v16 proof: three SEPARATE single-button
          # radio groups; arrows never cross groups; 2s focus was on Finish per v16-4a).
          # v16 FOCUSCHAIN gave the hwnd path: focused radio 262974 -> inner #32770 page
          # dialog 328914 -> wizard 132144. Enumerate children for real hwnds, then
          # BM_CLICK the demo radio directly (bypasses hit-testing/input routing).
          $wizH = [IntPtr]::Zero
          $fg = [W.N2]::GetForegroundWindow()
          $fgT = New-Object System.Text.StringBuilder 512
          [W.N2]::GetWindowText($fg, $fgT, 512) | Out-Null
          $fgC = New-Object System.Text.StringBuilder 256
          [W.N2]::GetClassName($fg, $fgC, 256) | Out-Null
          Write-Host "DIAG_FG: h=$($fg.ToInt64()) class=[$($fgC.ToString())] title=[$($fgT.ToString())]"
          if ($fgT.ToString() -like "*Open an Account*") { $wizH = $fg }
          Write-Host "WIZHWND: $($wizH.ToInt64())"
          if ($wizH -eq [IntPtr]::Zero) { throw "wizard window not foreground" }
          # overlay check: what window actually owns the point we have been clicking
          $pt = New-Object W.N2+POINT
          $pt.X = 211; $pt.Y = 222
          $wfp = [W.N2]::WindowFromPoint($pt)
          $wfpT = New-Object System.Text.StringBuilder 256
          [W.N2]::GetWindowText($wfp, $wfpT, 256) | Out-Null
          $wfpC = New-Object System.Text.StringBuilder 256
          [W.N2]::GetClassName($wfp, $wfpC, 256) | Out-Null
          $wpid = [uint32]0
          [void][W.N2]::GetWindowThreadProcessId($wfp, [ref]$wpid)
          $wfpRoot = [W.N2]::GetAncestor($wfp, 2)
          Write-Host "WFP(211,222): h=$($wfp.ToInt64()) class=[$($wfpC.ToString())] title=[$($wfpT.ToString())] pid=$wpid root=$($wfpRoot.ToInt64())"
          # child enumeration: radios live under an inner #32770 page dialog
          $script:radioHwnds = @()
          $script:radioYs = @()
          $demoHwnd = [IntPtr]::Zero
          $demoBestY = [int]::MaxValue
          $childH = [IntPtr]::Zero
          $ci = 0
          while ($true) {
            $childH = [W.N2]::FindWindowEx($wizH, $childH, $null, $null)
            if ($childH -eq [IntPtr]::Zero) { break }
            $ci++
            $t1 = New-Object System.Text.StringBuilder 256
            [W.N2]::GetWindowText($childH, $t1, 256) | Out-Null
            $c1 = New-Object System.Text.StringBuilder 256
            [W.N2]::GetClassName($childH, $c1, 256) | Out-Null
            $r1 = New-Object W.N2+RECT
            [void][W.N2]::GetWindowRect($childH, [ref]$r1)
            $vis1 = [W.N2]::IsWindowVisible($childH)
            $chk1 = [W.N2]::SendMessage($childH, 0xF2, [IntPtr]::Zero, [IntPtr]::Zero)
            Write-Host ("CHILD[{0}]: h={1} class=[{2}] title=[{3}] rect=({4},{5})-({6},{7}) vis={8} check={9}" -f $ci, $childH.ToInt64(), $c1.ToString(), $t1.ToString(), $r1.Left, $r1.Top, $r1.Right, $r1.Bottom, $vis1, $chk1.ToInt64())
            $cl1 = $c1.ToString()
            if (($cl1 -eq "#32770") -or ($cl1 -eq "Button")) {
              $wpx = $r1.Right - $r1.Left
              $hpx = $r1.Bottom - $r1.Top
              if ($cl1 -eq "Button" -and $wpx -ge 8 -and $wpx -le 30 -and $hpx -ge 8 -and $hpx -le 30) {
                Write-Host "RADIO_CAND: h=$($childH.ToInt64()) rect=($($r1.Left),$($r1.Top)) check=$($chk1.ToInt64())"
                $script:radioHwnds += $childH
                $script:radioYs += $r1.Top
                if ($r1.Top -lt $demoBestY) { $demoBestY = $r1.Top; $demoHwnd = $childH }
              }
              if ($cl1 -eq "#32770") {
                $g2 = [IntPtr]::Zero
                $gi = 0
                while ($true) {
                  $g2 = [W.N2]::FindWindowEx($childH, $g2, $null, $null)
                  if ($g2 -eq [IntPtr]::Zero) { break }
                  $gi++
                  $t2 = New-Object System.Text.StringBuilder 256
                  [W.N2]::GetWindowText($g2, $t2, 256) | Out-Null
                  $c2 = New-Object System.Text.StringBuilder 256
                  [W.N2]::GetClassName($g2, $c2, 256) | Out-Null
                  $r2 = New-Object W.N2+RECT
                  [void][W.N2]::GetWindowRect($g2, [ref]$r2)
                  $vis2 = [W.N2]::IsWindowVisible($g2)
                  $chk2 = [W.N2]::SendMessage($g2, 0xF2, [IntPtr]::Zero, [IntPtr]::Zero)
                  Write-Host ("CHILD2[{0}]: h={1} class=[{2}] title=[{3}] rect=({4},{5})-({6},{7}) vis={8} check={9}" -f $gi, $g2.ToInt64(), $c2.ToString(), $t2.ToString(), $r2.Left, $r2.Top, $r2.Right, $r2.Bottom, $vis2, $chk2.ToInt64())
                  if ($c2.ToString() -eq "Button") {
                    $w2 = $r2.Right - $r2.Left
                    $h2 = $r2.Bottom - $r2.Top
                    if ($w2 -ge 8 -and $w2 -le 30 -and $h2 -ge 8 -and $h2 -le 30) {
                      Write-Host "RADIO_CAND2: h=$($g2.ToInt64()) rect=($($r2.Left),$($r2.Top)) check=$($chk2.ToInt64())"
                      $script:radioHwnds += $g2
                      $script:radioYs += $r2.Top
                      if ($r2.Top -lt $demoBestY) { $demoBestY = $r2.Top; $demoHwnd = $g2 }
                    }
                  }
                }
              }
            }
          }
          Write-Host "RADIO_DEMO: hwnd=$($demoHwnd.ToInt64()) topmostY=$demoBestY count=$($script:radioHwnds.Count)"
          function Dump-RadioChecks($tag) {
            for ($k = 0; $k -lt $script:radioHwnds.Count; $k++) {
              $chk = [W.N2]::SendMessage($script:radioHwnds[$k], 0xF2, [IntPtr]::Zero, [IntPtr]::Zero)
              Write-Host "CHECK[$tag][$k]: h=$($script:radioHwnds[$k].ToInt64()) y=$($script:radioYs[$k]) check=$($chk.ToInt64())"
            }
          }
          function Test-DemoChecked {
            if ($demoHwnd -eq [IntPtr]::Zero) { return $false }
            $chk = [W.N2]::SendMessage($demoHwnd, 0xF2, [IntPtr]::Zero, [IntPtr]::Zero)
            return ($chk.ToInt64() -eq 1)
          }
          Dump-RadioChecks "initial"
          if ($demoHwnd -ne [IntPtr]::Zero) {
            Write-Host "MECH_BMCLICK: hwnd=$($demoHwnd.ToInt64())"
            [void][W.N2]::SendMessage($demoHwnd, 0xF5, [IntPtr]::Zero, [IntPtr]::Zero)
            Start-Sleep -Seconds 1
            Shot "v17-5a-bmclick"
            Dump-RadioChecks "afterbmclick"
          }
          $demoChecked = Test-DemoChecked
          Write-Host "MECH_BMCLICK: demoChecked=$demoChecked"
          if (-not $demoChecked -and $demoHwnd -ne [IntPtr]::Zero) {
            Write-Host "MECH_SETCHECK: forcing BST_CHECKED"
            [void][W.N2]::SendMessage($demoHwnd, 0xF3, [IntPtr]1, [IntPtr]::Zero)
            [void][W.N2]::InvalidateRect($demoHwnd, [IntPtr]::Zero, $true)
            Start-Sleep -Seconds 1
            Shot "v17-5b-setcheck"
            Dump-RadioChecks "aftersetcheck"
            $demoChecked = Test-DemoChecked
            Write-Host "MECH_SETCHECK: demoChecked=$demoChecked"
          }
          if (-not $demoChecked -and $demoHwnd -ne [IntPtr]::Zero) {
            Write-Host "MECH_SPACE: SetFocus + SPACE"
            [void][W.N2]::SetForegroundWindow($wizH)
            Start-Sleep -Milliseconds 400
            [void][W.N2]::SetFocus($demoHwnd)
            Start-Sleep -Milliseconds 400
            $ws.SendKeys(" ")
            Start-Sleep -Seconds 1
            Shot "v17-5c-space"
            Dump-RadioChecks "afterspace"
            $demoChecked = Test-DemoChecked
            Write-Host "MECH_SPACE: demoChecked=$demoChecked"
          }
          Shot "v17-5-demoselected"
          Write-Host "SELECT_RESULT: demoChecked=$demoChecked"
          # UIA recheck: sub-form swap proof (Login/Password/Server statics vanish when
          # demo is selected; demo field set appears instead)
          try {
            $win2 = [System.Windows.Automation.AutomationElement]::FromHandle($wizH)
            $ctrls2 = $win2.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            $i2 = 0
            foreach ($c in $ctrls2) {
              $nm2 = ""
              try { $nm2 = $c.Current.Name } catch {}
              if ($nm2 -match "Login|Password|Server|demo|real|existing|virtual|First|Last|name|Invest") {
                $r3 = $c.Current.BoundingRectangle
                Write-Host ("UIA2[{0}]: [{1}] rect=({2},{3})" -f $i2, $nm2, [int]$r3.X, [int]$r3.Y)
              }
              $i2++
            }
            Write-Host "UIA2_COUNT: $i2"
          } catch { Write-Host "UIA2_ERROR: $($_.Exception.Message)" }
          # fill: TAB map for the demo sub-form (v8-5 layout). If demo selection still
          # failed the typing lands in the existing-account fields harmlessly, as in v12-v16.
          $ws.SendKeys("{TAB}")
          Start-Sleep -Milliseconds 600
          $ws.SendKeys("Clanker")
          Start-Sleep -Milliseconds 600
          $ws.SendKeys("{TAB}")
          $ws.SendKeys("Cepator")
          Start-Sleep -Milliseconds 600
          $ws.SendKeys("{TAB}")
          $ws.SendKeys("{HOME}+{END}{DEL}")
          $ws.SendKeys("01/01/1990")
          Start-Sleep -Milliseconds 600
          $ws.SendKeys("{TAB}")
          $ws.SendKeys("rivet5592@agentmail.to")
          Start-Sleep -Seconds 2
          Shot "v17-6-typed"
          $ws.SendKeys("{TAB}")
          $ws.SendKeys("{TAB}")
          Start-Sleep -Milliseconds 600
          Shot "v17-7-phonefocus"
          $digits = "$env:PURPLE_PHONE" -replace "[^0-9]", ""
          $local = $digits.Substring(3)
          $ws.SendKeys($local)
          Start-Sleep -Seconds 2
          Shot "v17-8-phone-typed"
          Dump-RadioChecks "afterfill"
          # terms checkbox measured at (304,518) on the MetaQuotes demo layout; AXSE
          # layout unverified; miss is a harmless no-op. Then Next at (727,608).
          Click 304 518
          Start-Sleep -Seconds 2
          Click 727 608
          Start-Sleep -Seconds 12
          Shot "v17-9-afternext"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizard-v17
          path: "v17-*.png"
