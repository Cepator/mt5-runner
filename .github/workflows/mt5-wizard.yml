name: MT5 wizard attempt v22

on:
  workflow_dispatch: {}

jobs:
  mt5:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install and boot MT5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" -Wait
          Start-Process -FilePath "C:\Program Files\MetaTrader 5\terminal64.exe" -ArgumentList "/portable"
          Start-Sleep -Seconds 75

      - name: Drive wizard, SPACE on verified-focused radio, enum evidence battery, BM ladder fallback, fill
        shell: pwsh
        env:
          PURPLE_PHONE: ${{ secrets.PURPLE_PHONE }}
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          Add-Type -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(int f, int dx, int dy, int d, int i);' -Name M -Namespace W
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          namespace W {
            public struct RECT { public int Left, Top, Right, Bottom; }
            public struct POINT { public int X, Y; }
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            public class N2 {
              [DllImport("user32.dll", SetLastError=true)] public static extern IntPtr FindWindowEx(IntPtr parent, IntPtr child, string cls, string win);
              [DllImport("user32.dll", SetLastError=true)] public static extern bool EnumChildWindows(IntPtr parent, EnumProc cb, IntPtr l);
              [DllImport("user32.dll", SetLastError=true)] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
              [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
              [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr h, StringBuilder sb, int max);
              [DllImport("user32.dll")] public static extern int GetClassName(IntPtr h, StringBuilder sb, int max);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
              [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, uint msg, IntPtr w, IntPtr l);
              [DllImport("user32.dll", SetLastError=true)] public static extern bool PostMessage(IntPtr h, uint msg, IntPtr w, IntPtr l);
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, ref RECT r);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll")] public static extern bool InvalidateRect(IntPtr h, IntPtr rect, bool erase);
              [DllImport("user32.dll")] public static extern IntPtr SetFocus(IntPtr h);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
              [DllImport("user32.dll")] public static extern IntPtr WindowFromPoint(POINT p);
              [DllImport("user32.dll")] public static extern IntPtr GetAncestor(IntPtr h, uint flags);
              [DllImport("user32.dll")] public static extern IntPtr GetParent(IntPtr h);
              [DllImport("user32.dll")] public static extern IntPtr GetWindow(IntPtr h, uint cmd);
              [DllImport("user32.dll")] public static extern int GetDlgCtrlID(IntPtr h);
            }
          }
          '@
          Add-Type -MemberDefinition '[DllImport("user32.dll")] public static extern int GetWindowLong(IntPtr h, int i); [DllImport("user32.dll")] public static extern bool IsWindowEnabled(IntPtr h); [DllImport("user32.dll")] public static extern bool EnableWindow(IntPtr h, bool e); [DllImport("user32.dll")] public static extern bool AttachThreadInput(uint a, uint b, bool f); [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId(); [DllImport("user32.dll")] public static extern IntPtr GetFocus(); [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);' -Name M3 -Namespace W
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Click($x, $y) {
            [W.M]::SetCursorPos($x, $y) | Out-Null
            Start-Sleep -Milliseconds 300
            [W.M]::mouse_event(2, 0, 0, 0, 0)
            [W.M]::mouse_event(4, 0, 0, 0, 0)
          }
          $ws = New-Object -ComObject WScript.Shell
          if ($ws.AppActivate("LiveUpdate")) { Start-Sleep -Seconds 2; $ws.SendKeys("{ESC}"); Start-Sleep -Seconds 3 }
          $null = $ws.AppActivate("Open an Account")
          Start-Sleep -Seconds 2
          $ws.SendKeys("Purple")
          Start-Sleep -Seconds 6
          Shot "v22-1-searched"
          $ws.SendKeys("{ENTER}")
          Start-Sleep -Seconds 8
          Shot "v22-2-afterenter"
          Click 600 241
          Start-Sleep -Seconds 3
          Shot "v22-3-rowclick"
          Click 723 610
          # v22 kill shot: v16 FOCUSCHAIN proved keyboard focus lands on a radio pane
          # ~4s after the page transition (FOCUSCHAIN[0] unnamed Button), and the fill
          # TAB map (TAB then Clanker always lands in Login) confirms the focused
          # control TABs straight into the sub-form. Every run typed or sent arrows;
          # NOBODY has ever pressed SPACE while a radio pane has focus. SPACE is the
          # standard radio toggle key. v17 proved radios are not reachable as plain
          # Button hwnds from the wizard root (FindWindowEx zero children), so the
          # keyboard route is now primary.
          Start-Sleep -Seconds 4
          Shot "v22-4-form"
          $wizH = [IntPtr]::Zero
          $fg = [W.N2]::GetForegroundWindow()
          $fgT = New-Object System.Text.StringBuilder 512
          [W.N2]::GetWindowText($fg, $fgT, 512) | Out-Null
          $fgC = New-Object System.Text.StringBuilder 256
          [W.N2]::GetClassName($fg, $fgC, 256) | Out-Null
          Write-Host "DIAG_FG: h=$($fg.ToInt64()) class=[$($fgC.ToString())] title=[$($fgT.ToString())]"
          if ($fgT.ToString() -like "*Open an Account*") { $wizH = $fg }
          Write-Host "WIZHWND: $($wizH.ToInt64())"
          if ($wizH -eq [IntPtr]::Zero) { throw "wizard window not foreground" }
          # evidence battery 1: who owns the clicked point, and the full ancestor chain
          $pt = New-Object W.POINT
          $pt.X = 211; $pt.Y = 222
          $wfp = [W.N2]::WindowFromPoint($pt)
          $wfpC = New-Object System.Text.StringBuilder 256
          [W.N2]::GetClassName($wfp, $wfpC, 256) | Out-Null
          $wpid = [uint32]0
          [void][W.N2]::GetWindowThreadProcessId($wfp, [ref]$wpid)
          Write-Host "WFP(211,222): h=$($wfp.ToInt64()) class=[$($wfpC.ToString())] pid=$wpid"
          $anc = $wfp
          $ai = 0
          while ($anc -ne [IntPtr]::Zero -and $ai -lt 10) {
            $aC = New-Object System.Text.StringBuilder 256
            [W.N2]::GetClassName($anc, $aC, 256) | Out-Null
            $aRoot = [W.N2]::GetAncestor($anc, 2)
            $aRootOwner = [W.N2]::GetAncestor($anc, 3)
            Write-Host ("ANCEST[{0}]: h={1} class=[{2}] parent={3} GA_ROOT={4} GA_ROOTOWNER={5}" -f $ai, $anc.ToInt64(), $aC.ToString(), [W.N2]::GetParent($anc).ToInt64(), $aRoot.ToInt64(), $aRootOwner.ToInt64())
            $anc = [W.N2]::GetParent($anc)
            $ai++
          }
          # evidence battery 2: EnumChildWindows (all descendants, different code path
          # from FindWindowEx which returned zero children in v17)
          $global:ekids = New-Object System.Collections.Generic.List[long]
          $cbC = [W.EnumProc]{ param($h, $l)
            try {
              $global:ekids.Add($h.ToInt64())
            } catch {}
            return $true
          }
          $enumOk = $false
          try { $enumOk = [W.N2]::EnumChildWindows($wizH, $cbC, [IntPtr]::Zero) } catch { Write-Host "ENUMC_ERROR: $($_.Exception.Message)" }
          Write-Host "ENUMC: ok=$enumOk count=$($global:ekids.Count)"
          $script:radioHwnds = @()
          $script:radioYs = @()
          $script:radioIds = @()
          $demoHwnd = [IntPtr]::Zero
          $demoBestY = [int]::MaxValue
          $ei = 0
          foreach ($kid in $global:ekids) {
            $kh = [IntPtr]$kid
            $kT = New-Object System.Text.StringBuilder 256
            [W.N2]::GetWindowText($kh, $kT, 256) | Out-Null
            $kC = New-Object System.Text.StringBuilder 256
            [W.N2]::GetClassName($kh, $kC, 256) | Out-Null
            $kR = New-Object W.RECT
            [void][W.N2]::GetWindowRect($kh, [ref]$kR)
            $kVis = [W.N2]::IsWindowVisible($kh)
            $kId = [W.N2]::GetDlgCtrlID($kh)
            Write-Host ("CHILD_E[{0}]: h={1} id={2} class=[{3}] title=[{4}] rect=({5},{6})-({7},{8}) vis={9}" -f $ei, $kid, $kId, $kC.ToString(), $kT.ToString(), $kR.Left, $kR.Top, $kR.Right, $kR.Bottom, $kVis)
            if ($kC.ToString() -eq "Button") {
              $kw = $kR.Right - $kR.Left
              $kh2 = $kR.Bottom - $kR.Top
              if ($kw -ge 8 -and $kw -le 30 -and $kh2 -ge 8 -and $kh2 -le 30) {
                Write-Host "RADIO_E: h=$kid rect=($($kR.Left),$($kR.Top)) id=$kId"
                $script:radioHwnds += $kh
                $script:radioYs += $kR.Top
                $script:radioIds += $kId
                if ($kR.Top -lt $demoBestY) { $demoBestY = $kR.Top; $demoHwnd = $kh }
              }
            }
            $ei++
          }
          # evidence battery 3: top-level windows owned by the wizard (owned page
          # dialogs, in case the pages are WS_POPUP siblings rather than children)
          $global:eowned = New-Object System.Collections.Generic.List[long]
          $cbO = [W.EnumProc]{ param($h, $l)
            try {
              if ([W.N2]::GetWindow($h, 4) -eq [IntPtr]::Zero) { return $true }
              if ([W.N2]::GetAncestor($h, 3) -eq $l) { $global:eowned.Add($h.ToInt64()) }
            } catch {}
            return $true
          }
          try { [void][W.N2]::EnumWindows($cbO, $wizH) } catch { Write-Host "ENUMW_ERROR: $($_.Exception.Message)" }
          $oi = 0
          foreach ($oh in $global:eowned) {
            $ohh = [IntPtr]$oh
            $oC = New-Object System.Text.StringBuilder 256
            [W.N2]::GetClassName($ohh, $oC, 256) | Out-Null
            $oT = New-Object System.Text.StringBuilder 256
            [W.N2]::GetWindowText($ohh, $oT, 256) | Out-Null
            $oVis = [W.N2]::IsWindowVisible($ohh)
            Write-Host ("OWNED[{0}]: h={1} class=[{2}] title=[{3}] vis={4}" -f $oi, $oh, $oC.ToString(), $oT.ToString(), $oVis)
            $oi++
          }
          Write-Host "OWNED_COUNT: $($global:eowned.Count)"
          # evidence battery 4: FindWindowEx retry with SetLastError ground truth
          $fex = [W.N2]::FindWindowEx($wizH, [IntPtr]::Zero, $null, $null)
          $fexErr = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
          Write-Host "ENUM_DIRECT: firstChild=$($fex.ToInt64()) lastError=$fexErr"
          function Dump-RadioChecks($tag) {
            for ($k = 0; $k -lt $script:radioHwnds.Count; $k++) {
              $chk = [W.N2]::SendMessage($script:radioHwnds[$k], 0xF2, [IntPtr]::Zero, [IntPtr]::Zero)
              Write-Host "CHECK[$tag][$k]: h=$($script:radioHwnds[$k].ToInt64()) y=$($script:radioYs[$k]) id=$($script:radioIds[$k]) check=$($chk.ToInt64())"
            }
          }
          Dump-RadioChecks "initial"
          # ROUTE A: style ground truth on every radio hwnd (WS_DISABLED theory, v18 verdict route 1)
          for ($k = 0; $k -lt $script:radioHwnds.Count; $k++) {
            $rh = $script:radioHwnds[$k]
            $styA = [W.M3]::GetWindowLong($rh, -16)
            $exsA = [W.M3]::GetWindowLong($rh, -20)
            $enbA = [W.M3]::IsWindowEnabled($rh)
            $disA = ($styA -band 0x08000000) -ne 0
            Write-Host ("STYLE[{0}]: h={1} y={2} id={3} enabled={4} style=0x{5:X8} exstyle=0x{6:X8} WS_DISABLED={7}" -f $k, $rh.ToInt64(), $script:radioYs[$k], $script:radioIds[$k], $enbA, $styA, $exsA, $disA)
          }
          # keyboard focus ground truth: which control has focus right now
          function Dump-Focused($tag) {
            try {
              $fe = [System.Windows.Automation.AutomationElement]::FocusedElement
              $fn = ""; $fc = ""; $fnh = -1
              try { $fn = $fe.Current.Name } catch {}
              try { $fc = $fe.Current.ClassName } catch {}
              try { $fnh = $fe.Current.NativeWindowHandle } catch {}
              $fr = $fe.Current.BoundingRectangle
              Write-Host ("FOCUSED[$tag]: name=[{0}] class=[{1}] rect=({2},{3})-({4},{5}) nativewnd={6} runtimeId={7}" -f $fn, $fc, [int]$fr.X, [int]$fr.Y, ([int]($fr.X+$fr.Width)), ([int]($fr.Y+$fr.Height)), $fnh, ($fe.GetRuntimeId() -join ','))
              return @{ y = [int]$fr.Y; cls = $fc; nh = $fnh }
            } catch {
              Write-Host "FOCUSED[$tag]_ERROR: $($_.Exception.Message)"
              return @{ y = -1; cls = ""; nh = -1 }
            }
          }
          $f1 = Dump-Focused "pre"
          # ROUTE B: AttachThreadInput + SetFocus(demo) + keybd_event SPACE, attached
          # real click backstop, EnableWindow if ROUTE A shows the demo pane disabled
          # (v18 verdict route 2, plus the attached-click variant never tried)
          # v22: whole route guarded - v19 died on a namespace typo AFTER EnableWindow
          # succeeded, before any selection attempt could run
          try {
          if ($demoHwnd -ne [IntPtr]::Zero) {
            $bpid = [uint32]0
            $mt5Tid = [W.N2]::GetWindowThreadProcessId($demoHwnd, [ref]$bpid)
            $myTid = [W.M3]::GetCurrentThreadId()
            $attB = [W.M3]::AttachThreadInput($myTid, $mt5Tid, $true)
            Write-Host "ATTACH: ok=$attB myTid=$myTid mt5Tid=$mt5Tid demoPid=$bpid"
            $enbD = [W.M3]::IsWindowEnabled($demoHwnd)
            if (-not $enbD) {
              [void][W.M3]::EnableWindow($demoHwnd, $true)
              Start-Sleep -Milliseconds 500
              $enbD2 = [W.M3]::IsWindowEnabled($demoHwnd)
              $styD = [W.M3]::GetWindowLong($demoHwnd, -16)
              Write-Host ("ENABLEWINDOW: now enabled={0} style=0x{1:X8}" -f $enbD2, $styD)
            }
            [void][W.N2]::SetFocus($demoHwnd)
            Start-Sleep -Milliseconds 600
            $gfB = [W.M3]::GetFocus()
            $gfMatch = ($gfB -eq $demoHwnd)
            Write-Host ("FOCUS_ATTACH: getFocus={0} demo={1} match={2}" -f $gfB.ToInt64(), $demoHwnd.ToInt64(), $gfMatch)
            if ($gfMatch) {
              [W.M3]::keybd_event(0x20, 0, 0, [UIntPtr]::Zero)
              Start-Sleep -Milliseconds 120
              [W.M3]::keybd_event(0x20, 0, 2, [UIntPtr]::Zero)
              Start-Sleep -Seconds 2
              Shot "v22-5a-attachspace"
              Dump-RadioChecks "attachspace"
            }
            $chkD = [W.N2]::SendMessage($demoHwnd, 0xF2, [IntPtr]::Zero, [IntPtr]::Zero)
            $sibChecked = $false
            for ($k = 1; $k -lt $script:radioHwnds.Count; $k++) {
              $ckS = [W.N2]::SendMessage($script:radioHwnds[$k], 0xF2, [IntPtr]::Zero, [IntPtr]::Zero)
              if ($ckS.ToInt64() -eq 1 -or $ckS.ToInt64() -eq 9) { $sibChecked = $true }
            }
            Write-Host "ATTACH_STATE: demoCheck=$($chkD.ToInt64()) siblingChecked=$sibChecked"
            if (-not ($chkD.ToInt64() -eq 1 -and -not $sibChecked)) {
              $dR = New-Object W.RECT
              [void][W.N2]::GetWindowRect($demoHwnd, [ref]$dR)
              $dcx = [int](($dR.Left + $dR.Right) / 2)
              $dcy = [int](($dR.Top + $dR.Bottom) / 2)
              Write-Host "ATTACH_CLICK: real click at demo center ($dcx,$dcy)"
              Click $dcx $dcy
              Start-Sleep -Seconds 2
              Shot "v22-5b-attachclick"
              Dump-RadioChecks "attachclick"
            }
            [void][W.M3]::AttachThreadInput($myTid, $mt5Tid, $false)
            Write-Host "DETACH: done"
            # v22 backstop: now that WS_DISABLED is cleared, a plain unattached real
            # click at the demo center should finally register (v10-v16 clicks were
            # eaten by the disabled bit)
            $chkE = [W.N2]::SendMessage($demoHwnd, 0xF2, [IntPtr]::Zero, [IntPtr]::Zero)
            if ($chkE.ToInt64() -ne 1) {
              $dR2 = New-Object W.RECT
              [void][W.N2]::GetWindowRect($demoHwnd, [ref]$dR2)
              Click ([int](($dR2.Left + $dR2.Right) / 2)) ([int](($dR2.Top + $dR2.Bottom) / 2))
              Start-Sleep -Seconds 2
              Shot "v22-5c-plainclick"
              Dump-RadioChecks "plainclick"
            }
          }
          } catch { Write-Host "ROUTE_B_ERROR: $($_.Exception.Message)" }
          # PRIMARY: SPACE route. Only send SPACE when focus sits in the demo radio
          # band (y 200-245, v16 rects (205,215)-(220,231)). Never blind SPACE: a
          # focused Finish button would activate on SPACE.
          $demoOk = $false
          if ($f1.y -ge 200 -and $f1.y -le 245) {
            Write-Host "PRIMARY_SPACE: focus already in demo radio band, sending SPACE"
            $ws.SendKeys(" ")
            Start-Sleep -Seconds 2
            Shot "v22-5a-space"
          } else {
            Write-Host "PRIMARY_UIAFOCUS: focus elsewhere (y=$($f1.y)), UIA SetFocus to demo Button pane"
            try {
              $win = [System.Windows.Automation.AutomationElement]::FromHandle($wizH)
              $ctrls = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
              $pick = $null
              $pi = 0
              foreach ($c in $ctrls) {
                $cc = ""; $r = $null
                try { $cc = $c.Current.ClassName } catch {}
                try { $r = $c.Current.BoundingRectangle } catch {}
                if ($cc -eq "Button" -and $r -ne $null -and [int]$r.Y -ge 200 -and [int]$r.Y -le 245 -and [int]$r.Width -le 30) {
                  Write-Host ("UIA_PANE[{0}]: class=[{1}] rect=({2},{3})-({4},{5})" -f $pi, $cc, [int]$r.X, [int]$r.Y, ([int]($r.X+$r.Width)), ([int]($r.Y+$r.Height)))
                  if ($pick -eq $null) { $pick = $c }
                }
                $pi++
              }
              if ($pick -ne $null) {
                $pick.SetFocus()
                Start-Sleep -Milliseconds 800
                $f2 = Dump-Focused "postsetfocus"
                $ws.SendKeys(" ")
                Start-Sleep -Seconds 2
                Shot "v22-5a-space"
              } else {
                Write-Host "PRIMARY_UIAFOCUS: no demo Button pane found under wizard"
              }
            } catch { Write-Host "PRIMARY_UIAFOCUS_ERROR: $($_.Exception.Message)" }
          }
          # verify: does the sub-form now show demo fields?
          function Test-Subform($tag) {
            $loginSeen = $false
            $firstSeen = $false
            try {
              $winX = [System.Windows.Automation.AutomationElement]::FromHandle($wizH)
              $ctrlsX = $winX.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
              $ix = 0
              foreach ($c in $ctrlsX) {
                $nmX = ""
                try { $nmX = $c.Current.Name } catch {}
                if ($nmX -match "Login|Password|Server|demo|real|existing|virtual|First|Last|name|Invest|Tel|E-mail|birth") {
                  $rX = $c.Current.BoundingRectangle
                  Write-Host ("UIA2[$tag][{0}]: [{1}] rect=({2},{3})" -f $ix, $nmX, [int]$rX.X, [int]$rX.Y)
                }
                if ($nmX -match "^Login") { $loginSeen = $true }
                if ($nmX -match "^First") { $firstSeen = $true }
                $ix++
              }
            } catch { Write-Host "UIA2[$tag]_ERROR: $($_.Exception.Message)" }
            Write-Host "SUBFORM_STATE[$tag]: loginSeen=$loginSeen firstSeen=$firstSeen"
            return @{ login = $loginSeen; first = $firstSeen }
          }
          $s1 = Test-Subform "afterspace"
          $demoOk = $s1.first
          # SECONDARY: BM ladder on real hwnds, only if the enum found radio Buttons
          # and SPACE failed. Correct constants this time: BM_CLICK=0xF5,
          # BM_GETCHECK=0xF2, BM_SETCHECK=0xF1 (v17 used 0xF3 which is BM_GETSTATE,
          # moot then since demoHwnd was 0), WM_LBUTTONDOWN=0x201, WM_LBUTTONUP=0x202,
          # WM_COMMAND=0x111, BN_CLICKED=0.
          if (-not $demoOk -and $demoHwnd -ne [IntPtr]::Zero) {
            Write-Host "MECH_BM: demoHwnd=$($demoHwnd.ToInt64()) starting ladder"
            [void][W.N2]::SendMessage($demoHwnd, 0xF5, [IntPtr]::Zero, [IntPtr]::Zero)
            Start-Sleep -Seconds 1
            Shot "v22-5b-bmsend"
            Dump-RadioChecks "postbmsend"
            $c1s = [W.N2]::SendMessage($demoHwnd, 0xF2, [IntPtr]::Zero, [IntPtr]::Zero)
            if ($c1s.ToInt64() -ne 1) {
              [void][W.N2]::PostMessage($demoHwnd, 0xF5, [IntPtr]::Zero, [IntPtr]::Zero)
              Start-Sleep -Seconds 1
              Shot "v22-5c-bmpost"
              Dump-RadioChecks "postbmpost"
              $c1p = [W.N2]::SendMessage($demoHwnd, 0xF2, [IntPtr]::Zero, [IntPtr]::Zero)
              if ($c1p.ToInt64() -ne 1) {
                $kR3 = New-Object W.RECT
                [void][W.N2]::GetWindowRect($demoHwnd, [ref]$kR3)
                $cx = [int](($kR3.Right - $kR3.Left) / 2)
                $cy = [int](($kR3.Bottom - $kR3.Top) / 2)
                $lp = [IntPtr](($cy -shl 16) -bor $cx)
                [void][W.N2]::PostMessage($demoHwnd, 0x201, [IntPtr]::Zero, $lp)
                Start-Sleep -Milliseconds 150
                [void][W.N2]::PostMessage($demoHwnd, 0x202, [IntPtr]::Zero, $lp)
                Start-Sleep -Seconds 1
                Shot "v22-5d-lbtn"
                Dump-RadioChecks "postlbtn"
                $c1l = [W.N2]::SendMessage($demoHwnd, 0xF2, [IntPtr]::Zero, [IntPtr]::Zero)
                if ($c1l.ToInt64() -ne 1) {
                  [void][W.N2]::SendMessage($demoHwnd, 0xF1, [IntPtr]1, [IntPtr]::Zero)
                  [void][W.N2]::InvalidateRect($demoHwnd, [IntPtr]::Zero, $true)
                  $par = [W.N2]::GetParent($demoHwnd)
                  $did = [W.N2]::GetDlgCtrlID($demoHwnd)
                  if ($par -ne [IntPtr]::Zero) {
                    $wp = [IntPtr](($did -shl 16))
                    [void][W.N2]::SendMessage($par, 0x111, $wp, $demoHwnd)
                  }
                  Start-Sleep -Seconds 1
                  Shot "v22-5e-setcheck"
                  Dump-RadioChecks "postsetcheck"
                }
              }
            }
            $finalChk = [W.N2]::SendMessage($demoHwnd, 0xF2, [IntPtr]::Zero, [IntPtr]::Zero)
            Write-Host "MECH_BM: finalCheck=$($finalChk.ToInt64())"
            $s1b = Test-Subform "afterbm"
            $demoOk = $s1b.first
          }
          # TERTIARY: TAB cycle with per-step focus dumps; SPACE only when the
          # focused rect lands in the demo radio band
          if (-not $demoOk) {
            Write-Host "TERTIARY_TABCYCLE: up to 5 TABs hunting the demo radio"
            for ($t = 1; $t -le 5; $t++) {
              $ws.SendKeys("{TAB}")
              Start-Sleep -Milliseconds 600
              $ft = Dump-Focused "tab$t"
              if ($ft.y -ge 200 -and $ft.y -le 245) {
                Write-Host "TERTIARY_TABCYCLE: focus on radio at tab $t, sending SPACE"
                $ws.SendKeys(" ")
                Start-Sleep -Seconds 2
                Shot "v22-5f-tabspace"
                break
              }
            }
            $s1c = Test-Subform "aftertab"
            $demoOk = $s1c.first
          }
          Shot "v22-5-demoselected"
          $s2 = Test-Subform "final"
          Write-Host "SELECT_RESULT: demoSubform=$($s2.first) loginStill=$($s2.login) radioHwndsFound=$($script:radioHwnds.Count)"
          # v22: v21 proved the personal fields live on the page AFTER Next
          # (postnext firstSeen=True). Flow reordered: advance to page 2 FIRST,
          # then UIA-located fill, then terms by name, then a second advance.
          function Find-Field($pattern) {
            $winF = [System.Windows.Automation.AutomationElement]::FromHandle($wizH)
            $ctrlsF = $winF.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            foreach ($c in $ctrlsF) {
              $nm = ""
              try { $nm = $c.Current.Name } catch {}
              if ($nm -match $pattern) {
                $r = $c.Current.BoundingRectangle
                if ($r.Width -gt 0 -and $r.Height -gt 0) {
                  return @{ cx = [int]($r.X + $r.Width/2); cy = [int]($r.Y + $r.Height/2); lx = [int]($r.X + 8); ly = [int]($r.Y + $r.Height/2); name = $nm; type = $c.Current.ControlType.ProgrammaticName }
                }
              }
            }
            return $null
          }
          function Fill-Field($pattern, $value, $tag) {
            $f = Find-Field $pattern
            if ($f -eq $null) { Write-Host "FIELD[$tag]: NOT FOUND pattern=$pattern"; return $false }
            Write-Host ("FIELD[{0}]: name=[{1}] type=[{2}] click=({3},{4})" -f $tag, $f.name, $f.type, $f.cx, $f.cy)
            Click $f.cx $f.cy
            Start-Sleep -Milliseconds 500
            $ws.SendKeys("^a")
            Start-Sleep -Milliseconds 150
            $ws.SendKeys("{DEL}")
            Start-Sleep -Milliseconds 200
            $ws.SendKeys($value)
            Start-Sleep -Milliseconds 600
            return $true
          }
          # PHASE 1: advance from account-type page to the personal-details page
          $nb1 = Find-Field "^(Next|Finish|Register|Create|Open)"
          if ($nb1 -ne $null) { Write-Host ("BUTTON[to-page2]: name=[{0}] click=({1},{2})" -f $nb1.name, $nb1.cx, $nb1.cy); Click $nb1.cx $nb1.cy }
          else { Write-Host "BUTTON[to-page2]: NOT FOUND, fallback (727,608)"; Click 727 608 }
          Start-Sleep -Seconds 8
          Shot "v22-6-page2"
          $sp2 = Test-Subform "page2"
          Write-Host "PAGE2_STATE: firstSeen=$($sp2.first) loginSeen=$($sp2.login)"
          # PHASE 2: fill the personal page
          $fillOk = 0
          if (Fill-Field "^First" "Clanker" "firstname") { $fillOk++ }
          if (Fill-Field "^Last" "Cepator" "lastname") { $fillOk++ }
          if (Fill-Field "birth|Born" "01/01/1990" "dob") { $fillOk++ }
          if (Fill-Field "E-?mail" "rivet5592@agentmail.to" "email") { $fillOk++ }
          Shot "v22-7-filled"
          $pc = Find-Field "Phone|Mobile|Tel"
          if ($pc -ne $null) {
            Write-Host ("FIELD[phonecombo]: name=[{0}] click=({1},{2})" -f $pc.name, $pc.cx, $pc.cy)
            Click $pc.cx $pc.cy
            Start-Sleep -Milliseconds 600
            $ws.SendKeys("Czech")
            Start-Sleep -Milliseconds 900
            $ws.SendKeys("{ENTER}")
            Start-Sleep -Milliseconds 600
            $ws.SendKeys("{TAB}")
            Start-Sleep -Milliseconds 400
            $ws.SendKeys("^a")
            Start-Sleep -Milliseconds 150
            $ws.SendKeys("{DEL}")
            $digits = "$env:PURPLE_PHONE" -replace "[^0-9]", ""
            if ($digits.Length -gt 3) { $local = $digits.Substring(3) } else { $local = $digits }
            $ws.SendKeys($local)
            Start-Sleep -Seconds 2
          } else { Write-Host "FIELD[phonecombo]: NOT FOUND" }
          Shot "v22-7b-phone"
          Dump-RadioChecks "afterfill"
          Write-Host "FILL_COUNT: ok=$fillOk of 4"
          # PHASE 3: terms checkbox at its own left edge
          $tc = Find-Field "agree|terms|conditions"
          if ($tc -ne $null) {
            Write-Host ("FIELD[terms]: name=[{0}] boxclick=({1},{2})" -f $tc.name, $tc.lx, $tc.ly)
            Click $tc.lx $tc.ly
            Start-Sleep -Seconds 2
          } else { Write-Host "FIELD[terms]: NOT FOUND" }
          Shot "v22-8-terms"
          # PHASE 4: submit and capture the result page
          $nb = Find-Field "^(Next|Finish|Register|Create|Open|Done)"
          if ($nb -ne $null) { Write-Host ("BUTTON[submit]: name=[{0}] click=({1},{2})" -f $nb.name, $nb.cx, $nb.cy); Click $nb.cx $nb.cy }
          else { Write-Host "BUTTON[submit]: NOT FOUND, fallback (727,608)"; Click 727 608 }
          Start-Sleep -Seconds 20
          Shot "v22-9-result"
          try {
            $winR = [System.Windows.Automation.AutomationElement]::FromHandle($wizH)
            $ctrlsR = $winR.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            $ri = 0
            foreach ($c in $ctrlsR) {
              $rn = ""
              try { $rn = $c.Current.Name } catch {}
              if ($rn -ne "" -and $rn.Length -gt 1) { Write-Host ("RESULT_TEXT[{0}]: {1}" -f $ri, $rn) }
              $ri++
            }
          } catch { Write-Host "RESULT_DUMP_ERROR: $($_.Exception.Message)" }
          $s3 = Test-Subform "postnext"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizard-v22
          path: "v22-*.png"
