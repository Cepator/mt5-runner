name: RivetSkew EA attach v2 (UIA)

on:
  workflow_dispatch: {}

jobs:
  demo:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
      MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
      MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MT5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" -Wait
          Start-Sleep -Seconds 10
          Write-Host "terminal present: $(Test-Path 'C:\Program Files\MetaTrader 5\terminal64.exe')"

      - name: Prime portable tree then compile EA
        shell: pwsh
        run: |
          $mt = "C:\Program Files\MetaTrader 5"
          Start-Process -FilePath "$mt\terminal64.exe" -ArgumentList "/portable"
          Start-Sleep -Seconds 60
          New-Item -ItemType Directory -Force "$mt\MQL5\Experts" | Out-Null
          Copy-Item RivetSkewEA.mq5 "$mt\MQL5\Experts\" -Force
          Stop-Process -Name terminal64 -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Write-Host "portable include present: $(Test-Path "$mt\MQL5\Include\Trade\Trade.mqh")"
          if (-not (Test-Path "$mt\MQL5\Include\Trade\Trade.mqh")) {
            $roam = Get-ChildItem "$env:APPDATA\MetaQuotes\Terminal" -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.FullName "MQL5\Include\Trade\Trade.mqh") } | Select-Object -First 1
            if ($roam) {
              Copy-Item (Join-Path $roam.FullName "MQL5\Include") "$mt\MQL5\Include" -Recurse -Force
              Write-Host "include copied from roaming data folder $($roam.Name)"
            } else {
              Write-Host "TRADE_MQH_NOWHERE"
            }
          }
          Write-Host "include ready: $(Test-Path "$mt\MQL5\Include\Trade\Trade.mqh")"
          $p = Start-Process -FilePath "$mt\MetaEditor64.exe" -ArgumentList "/portable","/compile:`"$mt\MQL5\Experts\RivetSkewEA.mq5`"","/log:`"$mt\MQL5\Experts\compile.log`"" -Wait -PassThru
          Write-Host "metaeditor exit code $($p.ExitCode)"
          if (Test-Path "$mt\MQL5\Experts\compile.log") { Get-Content "$mt\MQL5\Experts\compile.log" }
          if (Test-Path "$mt\MQL5\Experts\RivetSkewEA.ex5") { Write-Host "EX5_OK" } else { Write-Host "EX5_MISSING"; exit 1 }

      - name: Seed RivetSkew profile with four W1 charts
        shell: pwsh
        run: |
          $mt = "C:\Program Files\MetaTrader 5"
          $prof = "$mt\MQL5\Profiles\Charts\RivetSkew"
          New-Item -ItemType Directory -Force $prof | Out-Null
          $enc = [System.Text.Encoding]::Unicode
          $syms = @("EURUSD","GBPUSD","USDJPY","XAUUSD")
          $i = 1
          foreach ($s in $syms) {
            $id = [string](132000000000000000 + $i * 111111)
            $L = @(
              '<chart>',
              "id=$id",
              "symbol=$s",
              'period_type=2',
              'period_size=1',
              'scale=4',
              'mode=1',
              'grid=1',
              'scroll=1',
              'window_type=1',
              '',
              '<window>',
              'height=100',
              '',
              '<indicator>',
              'name=Main',
              'path=',
              'apply=1',
              'show_data=1',
              'scale_inherit=0',
              'scale_line=0',
              'scale_line_percent=50',
              'scale_line_value=0.000000',
              'scale_fix_min=0',
              'scale_fix_min_val=0.000000',
              'scale_fix_max=0',
              'scale_fix_max_val=0.000000',
              '</indicator>',
              '</window>',
              '</chart>',
              ''
            )
            $txt = $L -join "`r`n"
            [System.IO.File]::WriteAllText("$prof\chart0$i.chr", $txt, $enc)
            $i++
          }
          $wnd = "chart01.chr`r`nchart02.chr`r`nchart03.chr`r`nchart04.chr`r`n"
          [System.IO.File]::WriteAllText("$prof\order.wnd", $wnd, $enc)
          $cfg = "$mt\Config"
          New-Item -ItemType Directory -Force $cfg | Out-Null
          $ini = "[Common]`nProfile=RivetSkew`n"
          [System.IO.File]::WriteAllText("$cfg\common.ini", $ini, [System.Text.Encoding]::ASCII)
          Write-Host "profile seeded: $(Get-ChildItem $prof | ForEach-Object Name)"

      - name: Boot MT5 logged into demo account
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $mt = "C:\Program Files\MetaTrader 5"
          $ini = "[Common]`nLogin=$env:MT5_DEMO_LOGIN`nPassword=$env:MT5_DEMO_PASSWORD`nServer=$env:MT5_DEMO_SERVER`nProfile=RivetSkew`n"
          $iniPath = "$PWD\mt5login.ini"
          [System.IO.File]::WriteAllText($iniPath, $ini, [System.Text.Encoding]::ASCII)
          $p = Start-Process -FilePath "$mt\terminal64.exe" -ArgumentList "/portable","/config:$iniPath" -PassThru
          Start-Sleep -Seconds 45
          Shot "demo-v2-40s"
          Write-Host "terminal alive: $(-not $p.HasExited)"
          Write-Host "PID $($p.Id)"

      - name: Attach EA via UIA to all four charts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
          Add-Type -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(int f, int dx, int dy, int d, int i); [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra); [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow(); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);' -Name W4 -Namespace W
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Send-Chord($vk) {
            [W.W4]::keybd_event(0x11, 0, 0, [UIntPtr]::Zero)
            Start-Sleep -Milliseconds 60
            [W.W4]::keybd_event([byte]$vk, 0, 0, [UIntPtr]::Zero)
            Start-Sleep -Milliseconds 60
            [W.W4]::keybd_event([byte]$vk, 0, 2, [UIntPtr]::Zero)
            [W.W4]::keybd_event(0x11, 0, 2, [UIntPtr]::Zero)
          }
          function DblClick-At($x, $y) {
            [W.W4]::SetCursorPos([int]$x, [int]$y) | Out-Null
            Start-Sleep -Milliseconds 150
            [W.W4]::mouse_event(0x02, 0, 0, 0, 0); [W.W4]::mouse_event(0x04, 0, 0, 0, 0)
            Start-Sleep -Milliseconds 80
            [W.W4]::mouse_event(0x02, 0, 0, 0, 0); [W.W4]::mouse_event(0x04, 0, 0, 0, 0)
          }
          function Focus-Terminal($mainH) {
            [W.W4]::SetForegroundWindow($mainH) | Out-Null
            Start-Sleep -Milliseconds 400
            return ([W.W4]::GetForegroundWindow() -eq $mainH)
          }
          $mt = "C:\Program Files\MetaTrader 5"
          $tp = Get-Process terminal64 -ErrorAction Stop | Select-Object -First 1
          $mainH = $tp.MainWindowHandle
          if ($mainH -eq [IntPtr]::Zero) { Write-Host "MAIN_WINDOW_GONE"; exit 1 }
          Write-Host "main handle $mainH focused: $(Focus-Terminal $mainH)"
          $main = [System.Windows.Automation.AutomationElement]::FromHandle($mainH)

          # 1. Algo Trading enable (before attach so OnInit sees trade allowed)
          $algoBtn = $null
          foreach ($el in $main.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
            if ($el.Current.Name -match 'Algo Trading') { $algoBtn = $el; break }
          }
          if ($algoBtn) {
            $state = 'unknown'
            try { $tg = $algoBtn.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern); $state = $tg.Current.ToggleState.ToString() } catch {}
            Write-Host "ALGO_STATE $state"
            if ($state -eq 'Off') {
              $done = $false
              try { ($algoBtn.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern)).Toggle(); $done = $true } catch {}
              if (-not $done) { try { ($algoBtn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)).Invoke(); $done = $true } catch {} }
              if (-not $done) { Send-Chord 0x45 }
              Start-Sleep -Seconds 2
              try { $state2 = ($algoBtn.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern)).Current.ToggleState.ToString() } catch { $state2 = 'unknown' }
              Write-Host "ALGO_STATE_AFTER $state2"
            }
          } else {
            Write-Host "ALGO_BTN_NOT_FOUND using Ctrl+E"
            Send-Chord 0x45
            Start-Sleep -Seconds 2
          }

          # 2. Navigator visible
          $nav = $null
          foreach ($el in $main.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
            if ($el.Current.Name -eq 'Navigator') { $nav = $el; break }
          }
          if (-not $nav) {
            Write-Host "NAV_NOT_VISIBLE Ctrl+N"
            Send-Chord 0x4E
            Start-Sleep -Seconds 3
            foreach ($el in $main.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)) {
              if ($el.Current.Name -eq 'Navigator') { $nav = $el; break }
            }
          }
          Write-Host "NAV_FOUND $($nav -ne $null)"
          Start-Sleep -Seconds 2
          $treeItems = $main.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::TreeItem)))
          Write-Host "TREE_ITEMS $($treeItems.Count)"
          $expNode = $null
          foreach ($el in $treeItems) { if ($el.Current.Name -match '^Expert Advisors') { $expNode = $el; break } }
          if ($expNode) {
            try {
              $ec = $expNode.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
              if ($ec.Current.ExpandCollapseState -ne 'LeafNode') { $ec.Expand(); Start-Sleep -Seconds 2 }
              Write-Host "EXPERTS_NODE state $($ec.Current.ExpandCollapseState)"
            } catch { Write-Host "EXPERTS_EXPAND_SKIP $($_.Exception.Message)" }
          } else { Write-Host "EXPERTS_NODE_MISSING" }
          $treeItems = $main.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::TreeItem)))
          $eaName = $null
          foreach ($el in $treeItems) { if ($el.Current.Name -match 'RivetSkewEA') { $eaName = $el.Current.Name; break } }
          if (-not $eaName) { Write-Host "EA_ITEM_MISSING"; Shot "demo-v2-fail-notree"; exit 1 }
          Write-Host "EA_ITEM $eaName"

          # 3. Attach on each chart tab (attach, Ctrl+Tab) x4; re-find the tree item each loop (stale-element guard)
          $attached = 0
          for ($i = 1; $i -le 4; $i++) {
            Focus-Terminal $mainH | Out-Null
            Start-Sleep -Milliseconds 500
            $ea = $null
            foreach ($el in $main.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::TreeItem)))) {
              if ($el.Current.Name -match 'RivetSkewEA') { $ea = $el; break }
            }
            if (-not $ea) { Write-Host "EA_STALE_GONE attach $i"; Shot "demo-v2-fail-notree$i" }
            else {
              try { ($ea.GetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern)).ScrollIntoView() } catch {}
              try { $pt = $ea.GetClickablePoint() }
              catch { $r = $ea.Current.BoundingRectangle; $pt = New-Object System.Windows.Point ($r.X + $r.Width / 2), ($r.Y + $r.Height / 2) }
              DblClick-At $pt.X $pt.Y
            }
            $dlg = $null
            for ($w = 0; $w -lt 12; $w++) {
              Start-Sleep -Seconds 1
              $fh = [W.W4]::GetForegroundWindow()
              if ($fh -ne [IntPtr]::Zero -and $fh -ne $mainH -and [W.W4]::IsWindowVisible($fh)) {
                try {
                  $fe = [System.Windows.Automation.AutomationElement]::FromHandle($fh)
                  if ($fe.Current.ProcessId -eq $tp.Id -or $fe.Current.Name -match 'RivetSkewEA') { $dlg = $fe; break }
                } catch {}
              }
            }
            if (-not $dlg) { Write-Host "DIALOG_GONE attach $i"; Shot "demo-v2-fail-dialog$i" }
            else {
              $okBtn = $null
              $btnCond = New-Object System.Windows.Automation.AndCondition(
                (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)),
                (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'OK')))
              $okBtn = $dlg.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $btnCond)
              if ($okBtn) {
                try { ($okBtn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)).Invoke(); Write-Host "ATTACH$i OK invoked" }
                catch { [W.W4]::keybd_event(0x0D, 0, 0, [UIntPtr]::Zero); [W.W4]::keybd_event(0x0D, 0, 2, [UIntPtr]::Zero); Write-Host "ATTACH$i Enter fallback" }
                Start-Sleep -Seconds 6
                $attached++
              } else { Write-Host "OK_BTN_MISSING attach $i"; Shot "demo-v2-fail-okbtn$i" }
            }
            if ($i -lt 4) { Focus-Terminal $mainH | Out-Null; Send-Chord 0x09; Start-Sleep -Seconds 4 }
          }
          Write-Host "ATTACHED_COUNT $attached"
          Shot "demo-v2-attached"
          Start-Sleep -Seconds 15

          # 4. Evidence + gates
          $log = Get-ChildItem "$mt\logs" -Filter *.log | Where-Object { $_.Name -match '^\d{8}\.log$' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($log) { Copy-Item $log.FullName "$PWD\terminal-journal.log" -Force; Write-Host "journal: $($log.FullName)" } else { Write-Host "NO_TERMINAL_JOURNAL" }
          $elog = Get-ChildItem "$mt\MQL5\Logs" -Filter *.log -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^\d{8}\.log$' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($elog) { Copy-Item $elog.FullName "$PWD\experts-journal.log" -Force; Write-Host "experts log: $($elog.FullName)" } else { Write-Host "NO_EXPERTS_JOURNAL" }
          Copy-Item "$mt\MQL5\Experts\compile.log" "$PWD\compile.log" -Force -ErrorAction SilentlyContinue
          Shot "demo-v2-final"
          if ($elog) {
            $all = Get-Content $elog.FullName
            $inits = @($all | Select-String 'RivetSkew init (\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
            $warn = @($all | Select-String 'algo trading not enabled').Count
            $live = @($all | Select-String 'LIVE account refused').Count
            $atr = @($all | Select-String 'ATR handle failed').Count
            Write-Host "RIVETSKEW_INIT: $($inits.Count) lines syms=[$($inits -join ',')] distinct=$(@($inits | Sort-Object -Unique).Count)"
            Write-Host "ALGO_WARN: $warn"
            Write-Host "LIVE_REFUSED: $live"
            Write-Host "ATR_FAIL: $atr"
          } else { $inits = @(); $warn = 99; $live = 99; $atr = 99 }
          if ($log) {
            $tall = Get-Content $log.FullName
            foreach ($pat in @('authorized','authorization failed','invalid account','bad login','network','connected')) {
              $hits = @($tall | Select-String $pat)
              Write-Host "GATE $pat : $($hits.Count)"
              $hits | Select-Object -First 4 | ForEach-Object { Write-Host "G| $_" }
            }
            $authfail = @($tall | Select-String 'authorization failed|invalid account|bad login').Count
          } else { $authfail = 99 }
          $distinct = @($inits | Sort-Object -Unique).Count
          if ($attached -eq 4 -and $distinct -ge 4 -and $warn -eq 0 -and $live -eq 0 -and $atr -eq 0 -and $authfail -eq 0) {
            Write-Host "ATTACH_V2_OK"
          } else {
            Write-Host "ATTACH_V2_FAIL attached=$attached distinct=$distinct warn=$warn live=$live atr=$atr authfail=$authfail"
            Stop-Process -Name terminal64 -Force -ErrorAction SilentlyContinue
            Remove-Item "$PWD\mt5login.ini" -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Name terminal64 -Force -ErrorAction SilentlyContinue
          Remove-Item "$PWD\mt5login.ini" -Force -ErrorAction SilentlyContinue

      - name: Upload demo evidence v2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rivetskew-attach-v2
          path: |
            demo-v2-*.png
            terminal-journal.log
            experts-journal.log
            compile.log
