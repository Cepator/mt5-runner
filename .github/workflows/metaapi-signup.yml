name: MetaApi signup and token

on:
  workflow_dispatch: {}

jobs:
  signup:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --quiet playwright requests
          python -m playwright install chromium 2>&1 | Select-Object -Last 1
          Write-Host "playwright ready"

      - name: Run signup flow
        shell: pwsh
        env:
          META_EMAIL: rivet-trading@agentmail.to
          META_PASSWORD: ${{ secrets.META_PASSWORD }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
        run: |
          python signup_flow.py

      - name: Live verify token
        shell: pwsh
        run: |
          $tok = (Get-Content meta_token.txt -Raw).Trim()
          Write-Host "token length $($tok.Length)"
          try {
            $r = Invoke-WebRequest -Uri "https://mt-provisioning-api-v1.agiliumtrade.agiliumtrade.ai/users/current/accounts" -Headers @{ "auth-token" = $tok } -UseBasicParsing -TimeoutSec 30
            Write-Host ("VERIFY_HTTP " + [int]$r.StatusCode)
            if ([int]$r.StatusCode -ne 200) { exit 1 }
          } catch {
            $code = 0
            try { $code = [int]$_.Exception.Response.StatusCode } catch {}
            Write-Host ("VERIFY_HTTP " + $code)
            exit 1
          }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaapi-result
          path: |
            meta_token.txt
            shot-*.png
